name: Mirror daily feed

on:
  schedule:
    - cron: "23 4 * * *"     # every morning at 04:23 UTC (06:23 in Berlin in summer, 05:23 in winter)
  workflow_dispatch:          # the "Run workflow" button, to run it any time

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect student jobs and events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python mirror_feed.py
